name: Build and Pack PowerTools

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Maven Build durchführen (mit Offline-Toleranz falls im Cache)
        run: mvn clean package -B --batch-mode

      - name: Release-Ordner vorbereiten und Dateien packen
        run: |
          mkdir -p output/PowerTools-Release
          
          # JAR-Datei kopieren
          if [ -d "target" ]; then
            cp target/*.jar output/PowerTools-Release/
          fi
          
          # Resourcepack kopieren
          if [ -d "resourcepack" ]; then
            cp -r resourcepack output/PowerTools-Release/
          fi
          
          # README kopieren
          if [ -f "README.md" ]; then
            cp README.md output/PowerTools-Release/
          fi
          
          # Als ZIP packen
          cd output
          zip -r ../PowerTools-Bundle.zip PowerTools-Release

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-Distribution
          path: PowerTools-Bundle.zip
